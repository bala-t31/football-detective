# Builds an installable (debug-signed) Android APK on every push to main, or on demand.
# Download it from the run's "Artifacts" section (football-detective-apk).
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test game logic
        run: npm test

      - name: Build web app and sync into Android project
        run: npm run android:sync

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME is set).
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk football-detective.apk

      - uses: actions/upload-artifact@v4
        with:
          name: football-detective-apk
          path: football-detective.apk

      # Publish every main-branch build as a Release so the APK has a direct, public download link:
      #   https://github.com/<owner>/<repo>/releases/latest/download/football-detective.apk
      - name: Read app version
        id: version
        run: echo "name=$(grep -oP 'versionName \"\K[^\"]+' android/app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          name: Football Detective ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body: |
            Install on Android: download **football-detective.apk** below, open it, and allow installing from your browser or Files app if asked.
            Built from commit ${{ github.sha }}.
          files: football-detective.apk
          make_latest: true
