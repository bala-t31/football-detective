# Builds an installable (debug-signed) Android APK on every push to main, or on demand.
# Download it from the run's "Artifacts" section (football-detective-apk).
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test game logic
        run: npm test

      - name: Build web app and sync into Android project
        run: npm run android:sync

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME is set).
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk football-detective.apk

      - uses: actions/upload-artifact@v4
        with:
          name: football-detective-apk
          path: football-detective.apk
